<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

h2{font-size:12px;font-weight:500;margin:0 0 10px}

/* ---- everything on one screen (no tabs) ---- */

<script>
// Auto-update: the home-screen app can keep an old copy; reload when a newer version is published.
const APP_VERSION="202611220608";
function checkUpdate(){fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{t=t.trim();
  if(t&&t!==APP_VERSION&&!location.search.includes("code=")&&new URLSearchParams(location.search).get("v")!==t){const u=new URL(location.href);u.searchParams.set("v",t);location.replace(u.toString());}}).catch(()=>{});}
checkUpdate();document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
</script>
<script src="core.js?v=202611220608"></script>
<script>
"use strict";
const {CLIENT_ID, SCOPES, DAY_KEYS, DEFAULTS, Spotify, playlistId, pad} = DPC;
const REPO = "OriBass2907/daily-playlist-creator";
// Must match a Redirect URI in the Spotify app settings exactly.
const REDIRECT = location.hostname.endsWith("github.io") ? "https://oribass2907.github.io/daily-playlist-creator/"
  : location.origin + location.pathname.replace(/index\.html$/, "");
const DAYS = [["א","sunday"],["ב","monday"],["ג","tuesday"],["ד","wednesday"],["ה","thursday"],["ו","friday"],["ש","saturday"]];
// key: [label, min, max, step, unit, max = unlimited, min = none]
const SLIDERS = {
  length_minutes: ["אורך הפלייליסט",60,600,15,"time",false],
  early_percent: ["תחילת ערב",0,100,5,"%",false],
  hebrew_percent: ["שירים בעברית",0,100,5,"%",false],
  blend_songs: ["שירים במעבר",0,10,1,"שירים",false],
  max_songs_per_artist: ["מקסימום שירים לאמן",1,11,1,"שירים",true],
  max_from_yesterday: ["מקסימום חוזרים מהפלייליסט הקודם",0,31,1,"שירים",true],
  bpm_min: ["BPM מינימלי",60,180,5,"BPM",false,true],
  bpm_max: ["BPM מקסימלי",60,180,5,"BPM",true],
  bpm_start: ["BPM בתחילת הערב",60,180,5,"BPM",false],
  bpm_end: ["BPM בסוף הערב",60,180,5,"BPM",false]
};
const BPM_KEYS = ["bpm_min", "bpm_max", "bpm_start", "bpm_end"];
const TEXTS = [["early_playlist","פלייליסט תחילת ערב","קישור מספוטיפיי","text"],
  ["late_playlist","פלייליסט אמצע ערב ומעלה","קישור מספוטיפיי","text"],
  ["new_playlist_name","שם הפלייליסט","{weekday} = יום, {date} = תאריך","text"],
  ["hebrew_artists","אמנים שנחשבים עברית","מופרדים בפסיק","list"],
  ["learn_from","פלייליסטים ללמידה","עד 3 קישורים, מופרדים בפסיק. ריק = פלייליסטי המקור","list"]];

// ============================================================ storage
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ls(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null");
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  } catch (e) { return null; }
}
function store() { return ls("dpc") || {current: null, accounts: {}}; }
function saveStore(s) { ls("dpc", s); }
function current() { const s = store(); return s.accounts[s.current] ? s.current : Object.keys(s.accounts)[0] || null; }
// One-time: turn on learning from Ori's example playlist (2026-11-22) for accounts saved before it existed.
(function seedLearn() { const s = store(); let ch = false;
  for (const a of Object.values(s.accounts || {})) if ((a.learn_seeded || 0) < 2) { a.learn = true; a.learn_from = DEFAULTS.learn_from.slice(); a.learn_seeded = 2; ch = true; }
  if (ch) saveStore(s); })();
function cfg(name) { return {...DEFAULTS, ...(store().accounts[name] || {}), _name: name}; }
function setCfg(name, patch) { const s = store(); s.accounts[name] = {...(s.accounts[name] || {}), ...patch}; saveStore(s); }
const slugOf = name => (name.replace(/[^A-Za-z0-9_-]/g, "") || "acct").toLowerCase().slice(0, 30);

// ============================================================ Spotify sign-in (PKCE: only the Client ID, no secret)
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function randomStr(n) { const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

// mode "app": this phone's own sign-in. mode "auto": a separate sign-in whose token goes (encrypted) to the 12:00 cloud run.
async function signIn(name, mode = "app") {
  const verifier = randomStr(64), state = randomStr(16);
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  ls("dpc_pkce", {verifier, state, name, mode});
  const q = new URLSearchParams({client_id: CLIENT_ID, response_type: "code", redirect_uri: REDIRECT, scope: SCOPES,
    code_challenge_method: "S256", code_challenge: challenge, state, show_dialog: "true"});
  location.href = "https://accounts.spotify.com/authorize?" + q;
}

function saveToken(name, j, old) {
  ls("dpc_tok_" + name, {access_token: j.access_token, refresh_token: j.refresh_token || (old && old.refresh_token),
    expires_at: Date.now() + (j.expires_in - 60) * 1000});
}

let pendingAuto = null;  // {name, token}: held in memory only, until the password is typed

async function finishSignIn() {
  const q = new URLSearchParams(location.search);
  if (!q.has("code") && !q.has("error")) return null;
  history.replaceState(null, "", location.pathname);
  const p = ls("dpc_pkce"); ls("dpc_pkce", null);
  if (q.has("error")) return {err: "ההתחברות בוטלה."};
  if (!p || p.state !== q.get("state")) return {err: "ההתחברות לא הושלמה. נסה שוב."};
  const j = await DPC.tokenRequest({grant_type: "authorization_code", code: q.get("code"), redirect_uri: REDIRECT, code_verifier: p.verifier});
  const s = store(); s.current = p.name; saveStore(s);
  if (p.mode === "auto") { pendingAuto = {name: p.name, token: j}; return {auto: true}; }
  saveToken(p.name, j);
  const me = await new Spotify(j.access_token).call("GET", "/me");
  setCfg(p.name, {spotify_user: me.display_name || me.id});
  return {ok: "התחברת לספוטיפיי בתור " + (me.display_name || me.id)};
}

async function accessToken(name) {
  const t = ls("dpc_tok_" + name);
  if (!t) throw new Error("החשבון לא מחובר לספוטיפיי.");
  if (Date.now() < t.expires_at) return t.access_token;
  const j = await DPC.tokenRequest({grant_type: "refresh_token", refresh_token: t.refresh_token});
  saveToken(name, j, t);
  return j.access_token;
}

// ============================================================ automatic 12:00 run
async function encryptForCloud(obj, password) {
  const enc = new TextEncoder(), salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, false, ["encrypt"]);
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, enc.encode(JSON.stringify(obj)));
  const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  return {v: 1, salt: b64(salt), iv: b64(iv), ct: b64(ct)};
}

async function autoStatus(name) {
  try {
    const r = await fetch(`https://raw.githubusercontent.com/${REPO}/main/status/${slugOf(name)}.json?t=${Date.now()}`);
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}
async function autoConnected(name) {
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/tokens`);
    if (!r.ok) return false;
    return (await r.json()).some(f => f.name.startsWith(slugOf(name) + "--"));
  } catch (e) { return false; }
}

// ============================================================ UI
function fmt(key, v) {
  const [, lo, hi, , unit, inf, none] = SLIDERS[key];
  if (inf && v === hi) return "∞";
  if (none && v === lo) return "ללא";
  if (unit === "time") return Math.floor(v / 60) + ":" + pad(v % 60) + "<small> שעות</small>";
  if (unit === "%") return v + "<small>%</small>";
  return v + "<small> " + unit + "</small>";
}
function slider(key, c) {
  const [label, lo, hi, step, unit, inf, none] = SLIDERS[key];
  let v = c[key]; v = v == null ? (inf ? hi : none ? lo : (DEFAULTS[key] ?? lo)) : Math.max(lo, Math.min(hi, +v));
  return `<div class="sl" id="sl_${key}"><div class="top"><label for="${key}">${label}</label><output id="o_${key}">${fmt(key, v)}</output></div>
<input type="range" id="${key}" min="${lo}" max="${hi}" step="${step}" value="${v}" style="--p:${100 * (v - lo) / (hi - lo)}%"></div>`;
}
const toggle = (id, label, on) => `<label class="sw">${label}<input type="checkbox" id="${id}" ${on ? "checked" : ""}><span class="t"></span></label>`;

function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove("on"), 1400); }

function renderPicker() {
  const s = store(), cur = current();
  $("#acct").innerHTML = Object.keys(s.accounts).map(n => `<option value="${esc(n)}" ${n === cur ? "selected" : ""}>${esc(n)}</option>`).join("")
    + `<option value="__new__">＋ חשבון חדש</option>`;
  $("#acct").style.display = Object.keys(s.accounts).length ? "" : "none";
}

function renderResult(r) {
  const p = [];
  if (r.link) p.push(`<div class="msg">✓ הפלייליסט נוצר בספוטיפיי. <a href="${esc(r.link)}" target="_blank" rel="noopener">פתח בספוטיפיי ←</a></div>`);
  else p.push(`<div class="msg">תצוגה מקדימה. שום דבר לא השתנה בספוטיפיי.</div>`);
  if (r.learned) p.push(`<div class="msg">🎚 נלמד מ־${r.learned.playlists} פלייליסטים: ${esc(r.learned.text)}.</div>`);
  r.warnings.forEach(w => p.push(`<div class="msg err">${esc(w)}</div>`));
  const mins = Math.floor(r.tracks.reduce((s, t) => s + t.ms, 0) / 60000);
  p.push(`<div class="stats"><div class="stat"><b>${r.tracks.length}</b><span>שירים</span></div><div class="stat"><b>${Math.floor(mins / 60)}:${pad(mins % 60)}</b><span>שעות</span></div><div class="stat"><b>${r.tracks.filter(t => t.he).length}</b><span>בעברית</span></div></div><div class="list">`);
  r.tracks.forEach((t, i) => p.push(`<div class="trk"><div class="num">${i + 1}</div><div class="ti"><b>${esc(t.name)}</b><span>${esc(t.artist)}</span></div><span class="tag">${t.early ? "תחילת ערב" : "אמצע ערב"}</span>${t.he ? '<span class="tag he">עברית</span>' : ""}</div>`));
  p.push("</div>");
  return p.join("");
}

function render(message = "", result = "") {
  renderPicker();
  const name = current();
  if (!name) return renderNew(message, true);
  const c = cfg(name), today = DPC.israelNow(), resting = DPC.isSkipDay(c, today);
  const signed = !!ls("dpc_tok_" + name), hp = c.hebrew_percent;
  const hint = `${Math.floor(c.length_minutes / 60)}:${pad(c.length_minutes % 60)} שעות · ${c.early_percent}% תחילת ערב` + (hp != null ? ` · ${hp}% עברית` : "");
  let go;
  if (!signed) go = `<div class="rest">החשבון הזה עוד לא מחובר לספוטיפיי.</div><button class="btn go" data-act="auth">התחבר לספוטיפיי</button>`;
  else if (resting) go = `<div class="rest">😴 היום יום חופש, אין פלייליסט אוטומטי.</div><button class="btn go" data-act="run">צור בכל זאת</button>`;
  else go = `<button class="btn go" data-act="run">צור את הפלייליסט של היום</button>`;
  const texts = TEXTS.map(([k, label, help, kind]) => `<div class="f"><label>${label} <small>${esc(help)}</small></label><input type="text" id="${k}" dir="auto" value="${esc(kind === "list" ? (c[k] || []).join(", ") : c[k])}"></div>`).join("");
  const bpmVals = DPC.bpmOn(c) ? c : {...c, ...(c.bpm_saved || {})};
  $("#app").innerHTML = `<section class="card hero compact">
<div class="toprow"><p class="day">${esc(DPC.playlistName(c, today))}</p></div>
<p class="hint">${esc(hint)}${c.spotify_user && signed ? " · " + esc(c.spotify_user) : ""}</p>
${message ? `<div class="heromsg">${message}</div>` : ""}
<div class="gorow">${go}<button class="btn ghost" data-act="dry" ${signed ? "" : "disabled"}>תצוגה מקדימה</button></div></section>
<div class="settings one">
<div class="grid">${slider("length_minutes", c)}${slider("early_percent", c)}${slider("hebrew_percent", c)}${slider("blend_songs", c)}${slider("max_songs_per_artist", c)}${slider("max_from_yesterday", c)}</div>
<div class="days">${DAYS.map(([l, k]) => `<label><input type="checkbox" data-day="${k}" ${c.skip_days.includes(k) ? "" : "checked"}><span>${l}</span></label>`).join("")}</div>
<div class="sws">${toggle("hebrew_on", "שליטה בעברית", hp != null)}${toggle("unique_titles", "בלי שמות כפולים", c.unique_titles !== false)}${toggle("learn", "כמו הפלייליסטים שלי", !!c.learn)}${toggle("bpm_on", "שליטה לפי BPM", DPC.bpmOn(c))}
<span id="risesw">${toggle("bpm_rise", "קצב עולה", DPC.bpmOn(c) ? !!c.bpm_rise : (c.bpm_saved ? !!c.bpm_saved.bpm_rise : true))}</span></div>
<div id="bpmbox" class="grid"><div id="rangebox" class="pair">${slider("bpm_min", bpmVals)}${slider("bpm_max", bpmVals)}</div><div id="risebox" class="pair">${slider("bpm_start", bpmVals)}${slider("bpm_end", bpmVals)}</div></div>
<button class="link more" data-tab="more">יצירה אוטומטית, פלייליסטי מקור וחשבון ←</button>
<div class="sheet" data-panel="more"><div class="sheethead"><b>הגדרות נוספות</b><button class="link" data-tab="">סגור ✕</button></div>
<div class="lbl">יצירה אוטומטית ב־12:00</div>
<div id="autostate" class="sub">בודק…</div><button class="btn light-btn small" data-act="auto">הפעל יצירה אוטומטית</button>
<div class="lbl">הגדרות</div>${texts}
<button class="link" data-act="auth">${signed ? "התחבר מחדש לספוטיפיי" : "התחבר לספוטיפיי"}</button>${signed ? '<button class="link" data-act="logout">נתק</button>' : ""}<button class="link danger" data-act="delete">מחק חשבון</button></div>
${result ? `<div class="sheet" data-panel="result"><div class="sheethead"><b>תוצאה</b><button class="link" data-tab="">סגור ✕</button></div>${result}</div>` : ""}
</div>`;
  showTab(result ? "result" : "");
  wireSettings(name);
  showAutoState(name);
}

async function showAutoState(name) {
  const [on, st] = await Promise.all([autoConnected(name), autoStatus(name)]);
  const el = $("#autostate"); if (!el || current() !== name) return;
  if (!on) { el.textContent = "כבוי. לחץ על הכפתור כדי להפעיל (פעם אחת)."; return; }
  let t = "✓ פעיל.";
  if (st && st.result === "created") t += ` אחרון: נוצר ב־${st.date.split("-").reverse().join(".")} ${st.time}.`;
  else if (st && st.result === "exists") t += ` ב־${st.date.split("-").reverse().join(".")} כבר היה פלייליסט, לא נדרס.`;
  else if (st && st.result === "skip") t += ` ${st.date.split("-").reverse().join(".")} היה יום חופש.`;
  else if (st && st.result === "error") t = "⚠ הריצה האחרונה נכשלה: " + st.error;
  if (st && st.authorized_at) {
    const exp = new Date(st.authorized_at); exp.setMonth(exp.getMonth() + 6);
    t += ` החיבור בתוקף עד ${pad(exp.getDate())}.${pad(exp.getMonth() + 1)}.${exp.getFullYear()} (ספוטיפיי מחייב חיבור מחדש כל חצי שנה).`;
  }
  el.textContent = t;
  el.classList.toggle("err", !!(st && st.result === "error"));
  const b = document.querySelector('[data-act=auto]'); if (b) b.textContent = "חבר מחדש את היצירה האוטומטית";
}

function renderAutoPassword(msg = "") {
  renderPicker();
  const pw = randomStr(24);
  $("#app").innerHTML = `${msg}<section class="card hero"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
<p class="day">כמעט סיימנו</p><p class="hint">החיבור לספוטיפיי הצליח. נשארו שני צעדים קצרים ב־GitHub.</p></section>
<div class="card light"><h3>מפתח</h3>
<div class="f"><label>המפתח שנוצר לך <small>(לא צריך לזכור אותו)</small></label><input type="text" id="pw" dir="ltr" readonly value="${pw}"></div>
<button class="btn light-btn" data-act="copypw">העתק מפתח</button>
<p class="sub">ואז <a href="https://github.com/${REPO}/settings/secrets/actions/new" target="_blank" rel="noopener">פתח את עמוד הסודות ב־GitHub</a>: ב־Name כותבים <b dir="ltr">DPC_KEY</b>, ב־Secret מדביקים את המפתח, ולוחצים Add secret. (אם כבר קיים DPC_KEY, לוחצים עליו ו־Update.)</p></div>
<div class="card light"><h3>שמירה</h3><button class="btn go" data-act="autosave">שמור את החיבור ב־GitHub</button>
<p class="sub">בעמוד שייפתח לוחצים <b>Commit changes</b> (פעמיים). זה הכל.</p></div>`;
}

function showTab(t) {
  document.querySelectorAll("[data-panel]").forEach(p => p.classList.toggle("on", p.dataset.panel === t));
}
document.addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });

function mixBar() {
  const r = $("#early_percent"); if (!r) return;
  $("#sl_hebrew_percent").classList.toggle("off", !$("#hebrew_on").checked);
  const on = $("#bpm_on"); if (on) { const rise = $("#bpm_rise").checked; $("#bpmbox").classList.toggle("hide", !on.checked); $("#risesw").classList.toggle("hide", !on.checked);
    $("#risebox").classList.toggle("hide", !rise); $("#rangebox").classList.toggle("hide", rise); }
}

function wireSettings(name) {
  const save = () => {
    const patch = {};
    for (const [key, [, lo, hi, , , inf, none]] of Object.entries(SLIDERS)) { const v = +$("#" + key).value; patch[key] = (inf && v === hi) || (none && v === lo) ? null : v; }
    if (!$("#hebrew_on").checked) patch.hebrew_percent = null;
    patch.bpm_rise = $("#bpm_rise").checked;
    if (!$("#bpm_on").checked) {   // off: remember the values for next time, but don't apply them
      patch.bpm_saved = Object.fromEntries([...BPM_KEYS, "bpm_rise"].map(k => [k, patch[k]]));
      Object.assign(patch, {bpm_min: null, bpm_max: null, bpm_rise: false});
    }
    patch.unique_titles = $("#unique_titles").checked;
    patch.learn = $("#learn").checked;
    patch.skip_days = [...document.querySelectorAll("[data-day]")].filter(i => !i.checked).map(i => i.dataset.day);
    for (const [k, , , kind] of TEXTS) { const v = $("#" + k).value.trim(); patch[k] = kind === "list" ? v.split(",").map(a => a.trim()).filter(Boolean) : v; }
    if (!patch.new_playlist_name) patch.new_playlist_name = DEFAULTS.new_playlist_name;
    setCfg(name, patch);
    const c = cfg(name), hp = c.hebrew_percent;
    $(".hint").firstChild.textContent = `${Math.floor(c.length_minutes / 60)}:${pad(c.length_minutes % 60)} שעות · ${c.early_percent}% תחילת ערב` + (hp != null ? ` · ${hp}% עברית` : "");
    toast("נשמר");
    clearTimeout(wireSettings.push);
    if (ls("dpc_tok_" + name)) wireSettings.push = setTimeout(async () => {
      try { await DPC.pushSettings(cfg(name), await accessToken(name)); } catch (e) { /* next playlist carries them anyway */ }
    }, 1500);
  };
  document.querySelectorAll(".settings input[type=range]").forEach(r => {
    r.addEventListener("input", () => { const [, lo, hi] = SLIDERS[r.id]; r.style.setProperty("--p", 100 * (r.value - lo) / (hi - lo) + "%"); $("#o_" + r.id).innerHTML = fmt(r.id, +r.value); mixBar(); });
    r.addEventListener("change", save);
  });
  document.querySelectorAll(".settings input:not([type=range])").forEach(i => i.addEventListener("change", () => { mixBar(); save(); }));
  mixBar();
}

function renderNew(message = "", first = false) {
  $("#acct").style.display = first ? "none" : "";
  $("#app").innerHTML = `${message}<section class="card hero"><div class="eq"><i></i><i></i><i></i><i></i><i></i></div>
<p class="day">${first ? "ברוך הבא" : "חשבון חדש"}</p><p class="hint">${first ? "מגדירים פעם אחת, ואז כל יום לוחצים \"צור\"." : "כל חשבון ספוטיפיי עם פלייליסטי מקור משלו."}</p></section>
<div class="card light"><div class="f"><label>שם החשבון <small>למשל SimchaVibes</small></label><input type="text" id="n_name" dir="ltr" value="${first ? "SimchaVibes" : ""}"></div>
<div class="f"><label>פלייליסט תחילת ערב <small>קישור מספוטיפיי</small></label><input type="text" id="n_early" dir="ltr" value="${first ? DEFAULTS.early_playlist : ""}"></div>
<div class="f"><label>פלייליסט אמצע ערב ומעלה <small>קישור מספוטיפיי</small></label><input type="text" id="n_late" dir="ltr" value="${first ? DEFAULTS.late_playlist : ""}"></div>
<button class="btn go" data-act="add">שמור והתחבר לספוטיפיי</button>
${first ? "" : '<button class="link" data-act="cancel" style="margin-top:12px">ביטול</button>'}</div>`;
}

const errBox = e => `<div class="msg err">${esc(e.message || e)}</div>`;

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, name = current();
  if (act === "auth") return signIn(name);
  if (act === "auto") return signIn(name, "auto");
  if (act === "copypw") { const i = $("#pw"); i.select(); try { await navigator.clipboard.writeText(i.value); } catch (e) { document.execCommand("copy"); } return toast("הועתק"); }
  if (act === "autosave") {
    const pw = $("#pw").value;
    if (!pendingAuto) return render(errBox("החיבור אבד. לחץ שוב על \"הפעל יצירה אוטומטית\"."));
    const box = await encryptForCloud({account: pendingAuto.name, refresh_token: pendingAuto.token.refresh_token,
      authorized_at: new Date().toISOString()}, pw);
    const ts = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
    const file = `tokens/${slugOf(pendingAuto.name)}--${ts}.json`;
    pendingAuto = null;
    const url = `https://github.com/${REPO}/new/main?filename=${encodeURIComponent(file)}&value=${encodeURIComponent(JSON.stringify(box))}`;
    render(`<div class="msg">✓ נפתח עמוד GitHub. לחץ שם <b>Commit changes</b>. אם הוא לא נפתח: <a href="${esc(url)}" target="_blank" rel="noopener">פתח כאן</a></div>`);
    window.open(url, "_blank");
    return;
  }
  if (act === "cancel") return render();
  if (act === "logout") { ls("dpc_tok_" + name, null); return render(`<div class="msg">החשבון נותק מספוטיפיי.</div>`); }
  if (act === "delete") {
    if (!confirm(`למחוק את החשבון "${name}" מהאפליקציה? (בספוטיפיי שום דבר לא נמחק)`)) return;
    const s = store(); delete s.accounts[name]; s.current = Object.keys(s.accounts)[0] || null; saveStore(s); ls("dpc_tok_" + name, null);
    return render();
  }
  if (act === "add") {
    const n = $("#n_name").value.trim(), e = $("#n_early").value.trim(), l = $("#n_late").value.trim();
    const bad = !/^[\p{L}\p{N} _-]{1,24}$/u.test(n) ? "שם החשבון: עד 24 אותיות או ספרות."
      : store().accounts[n] ? "כבר יש חשבון בשם הזה."
      : ![e, l].every(x => /^[A-Za-z0-9]{22}$/.test(playlistId(x))) ? "אחד הקישורים לא נראה כמו קישור לפלייליסט בספוטיפיי." : "";
    if (bad) return renderNew(errBox(bad), !Object.keys(store().accounts).length);
    setCfg(n, {early_playlist: e, late_playlist: l}); const s = store(); s.current = n; saveStore(s);
    return signIn(n);
  }
  if (act === "run" || act === "dry") {
    $("#busy").classList.add("on"); $("#busytxt").textContent = "מתחבר לספוטיפיי…";
    try { const r = await DPC.run(cfg(name), await accessToken(name), {dry: act === "dry", step: t => $("#busytxt").textContent = t}); render("", renderResult(r)); }
    catch (e) { render(errBox(e)); }
    finally { $("#busy").classList.remove("on"); window.scrollTo(0, 0); }
  }
});

$("#acct").addEventListener("change", e => {
  if (e.target.value === "__new__") return renderNew();
  const s = store(); s.current = e.target.value; saveStore(s); render();
});

(async () => {
  let msg = "";
  try {
    const r = await finishSignIn();
    if (r && r.auto) return renderAutoPassword();
    if (r) msg = r.err ? errBox(r.err) : `<div class="msg">✓ ${esc(r.ok)}</div>`;
  } catch (e) { msg = errBox(e); }
  render(msg);
})();
</script>
</body>
</html>
